version: 2
updates:
  # npm (Next.js + dependencias del proyecto)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci-cd"
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"
