name: "Escaneo de Seguridad (CodeQL)"

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    # Solo en PR que apunten a main o beta
    branches: [ "main", "beta" ]
  schedule:
    # Ejecución semanal (Lunes 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  analyze:
    name: Análisis de Vulnerabilidades (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # Inicializa el análisis de CodeQL
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Consultas para seguridad web mejoradas
          queries: security-extended,security-and-quality

      # Autobuild intenta construir el proyecto javascript/typescript automáticamente
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Realizar Análisis de CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
