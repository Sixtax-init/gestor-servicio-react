name: "CI (Integración Continua)"

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    branches: [ "main", "beta" ]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Verificar Lint (ESLint)
        run: npm run lint

      - name: Intentar Construcción (Build)
        run: npm run build
        env:
          # Variables temporales para evitar fallos de conexión en el build estático
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          JWT_SECRET: "ci_test_secret_key_only"
