name: "Gestión Académica: Calidad y Seguridad (DevOps)"
run-name: "🚀 DevOps: ${{ github.ref_name }} (#${{ github.run_number }})"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      run_quality_check:
        description: '✅ Ejecutar Validaciones (Lint & Build)'
        required: true
        type: boolean
        default: true
      run_security_scan:
        description: '🛡️ Ejecutar Escáner de Vulnerabilidades (CodeQL)'
        required: true
        type: boolean
        default: true


jobs:
  pipeline:
    name: Pipeline de Calidad y Seguridad
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Código
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Detectar Secrets (TruffleHog)
        id: trufflehog
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        # trufflesecurity/trufflehog@v3.94.2
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b
        with:
          path: ./
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json

      - name: Configurar Node.js (v20)
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Auditar Dependencias (npm audit)
        run: npm audit --audit-level=high --json > npm-audit-report.json 2>&1 || echo "AUDIT_FAILED=true" >> $GITHUB_ENV

      - name: Verificar Estilo (Lint)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_quality_check == true }}
        run: npm run lint -- --format json --output-file eslint-report.json || echo "LINT_FAILED=true" >> $GITHUB_ENV

      - name: Generar Reporte Lint Legible
        if: always()
        run: python3 .github/scripts/generate_lint_report.py

      - name: Inicializar CodeQL (Seguridad)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_security_scan == true }}
        # github/codeql-action@v3
        uses: github/codeql-action/init@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          languages: 'javascript-typescript'
          queries: security-extended,security-and-quality

      - name: Validar Construcción (Build)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_quality_check == true }}
        id: build_step
        run: |
          npm run build 2> build_error.log || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        env:
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          JWT_SECRET: "ci_test_secret_key_only"
          SESSION_SECRET: "ci_test_session_secret_key_only"

      - name: Analizar Vulnerabilidades (CodeQL)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_security_scan == true }}
        # github/codeql-action@v3
        uses: github/codeql-action/analyze@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          category: "/language:javascript-typescript"

      # ─── RESUMEN Y ARTEFACTO AL FINAL ──────────────────────────────────────
      # IMPORTANTE: reporte-pipeline.txt se genera aquí, el upload va DESPUÉS.

      - name: Generar Resumen Ejecutivo Final
        if: always()
        run: |
          echo "## 📋 Reporte Ejecutivo de Calidad, Construcción y Seguridad" >> $GITHUB_STEP_SUMMARY

          # ── Secrets ─────────────────────────────────────────────────────────
          echo "### 🔑 Detección de Secrets (TruffleHog)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.trufflehog.outcome }}" == "failure" ]; then
            echo "❌ **SECRETS DETECTADOS**: TruffleHog encontró secrets expuestos en el código." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.trufflehog.outcome }}" == "success" ]; then
            echo "✅ **SIN SECRETS**: No se detectaron secrets expuestos." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **OMITIDO**: Escaneo no aplica para este tipo de trigger (workflow_dispatch)." >> $GITHUB_STEP_SUMMARY
          fi

          # ── npm audit ───────────────────────────────────────────────────────
          echo "### 📦 Vulnerabilidades en Dependencias (npm audit)" >> $GITHUB_STEP_SUMMARY
          if [ "$AUDIT_FAILED" == "true" ]; then
            HIGH=$(python3 -c "import json; d=json.load(open('npm-audit-report.json')); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0))" 2>/dev/null || echo "?")
            CRITICAL=$(python3 -c "import json; d=json.load(open('npm-audit-report.json')); print(d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))" 2>/dev/null || echo "?")
            echo "❌ **VULNERABILIDADES ENCONTRADAS** — Críticas: ${CRITICAL}, Altas: ${HIGH}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **SIN VULNERABILIDADES**: No se encontraron dependencias con riesgo alto o crítico." >> $GITHUB_STEP_SUMMARY
          fi

          # ── Lint ────────────────────────────────────────────────────────────
          echo "### 🎨 Estilo y Estándares (Lint)" >> $GITHUB_STEP_SUMMARY
          if [ -f eslint-report.json ]; then
            ERROR_COUNT=$(python3 -c "import json; d=json.load(open('eslint-report.json')); print(sum(f['errorCount'] for f in d))" 2>/dev/null || echo "?")
            WARNING_COUNT=$(python3 -c "import json; d=json.load(open('eslint-report.json')); print(sum(f['warningCount'] for f in d))" 2>/dev/null || echo "?")
            FILES_WITH_ERRORS=$(python3 -c "import json; d=json.load(open('eslint-report.json')); print(len([f for f in d if f['errorCount']>0]))" 2>/dev/null || echo "?")
            echo "| Métrica | Resultado |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Errores | ${ERROR_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Avisos | ${WARNING_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📄 Archivos con errores | ${FILES_WITH_ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 📥 Descarga **\`eslint-report-legible.txt\`** del artefacto para ver el detalle completo por archivo y línea." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **OMITIDO**: El paso de lint no generó reporte." >> $GITHUB_STEP_SUMMARY
          fi

          # ── Build ───────────────────────────────────────────────────────────
          echo "### 🏗️ Estado de la Construcción" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD_FAILED" == "true" ]; then
            echo "❌ **LA CONSTRUCCIÓN FALLÓ**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            tail -n 10 build_error.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **CONSTRUCCIÓN EXITOSA**" >> $GITHUB_STEP_SUMMARY
          fi

          # ── CodeQL ──────────────────────────────────────────────────────────
          echo "### 🛡️ Escaneo de Seguridad (CodeQL)" >> $GITHUB_STEP_SUMMARY
          echo "✅ **ANÁLISIS COMPLETADO**: Revisa _Security › Code scanning_ en GitHub para ver resultados detallados." >> $GITHUB_STEP_SUMMARY

          # ── Generar reporte-pipeline.txt ────────────────────────────────────
          REPORT="reporte-pipeline.txt"
          {
            echo "============================================"
            echo " REPORTE DE CALIDAD Y SEGURIDAD"
            echo " Rama   : ${{ github.ref_name }}"
            echo " Commit : ${{ github.sha }}"
            echo " Fecha  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================"

            echo ""
            echo "[ SECRETS (TruffleHog) ]"
            if [ "${{ steps.trufflehog.outcome }}" == "failure" ]; then
              echo "  ESTADO : SECRETS DETECTADOS"
            elif [ "${{ steps.trufflehog.outcome }}" == "success" ]; then
              echo "  ESTADO : Sin secrets expuestos"
            else
              echo "  ESTADO : Omitido (trigger manual)"
            fi

            echo ""
            echo "[ VULNERABILIDADES EN DEPENDENCIAS (npm audit) ]"
            if [ "$AUDIT_FAILED" == "true" ]; then
              python3 -c "
import json
d = json.load(open('npm-audit-report.json'))
v = d.get('metadata', {}).get('vulnerabilities', {})
print(f'  ESTADO  : VULNERABILIDADES ENCONTRADAS')
print(f'  Criticas: {v.get(\"critical\", 0)}')
print(f'  Altas   : {v.get(\"high\", 0)}')
" 2>/dev/null || echo "  No se pudo parsear el reporte"
            else
              echo "  ESTADO  : Sin vulnerabilidades altas o criticas"
            fi

            echo ""
            echo "[ LINT (ESLint) ]"
            echo "  Ver detalle completo en: eslint-report-legible.txt"
            if [ -f eslint-report.json ]; then
              python3 -c "
import json
d = json.load(open('eslint-report.json'))
errors   = sum(f['errorCount'] for f in d)
warnings = sum(f['warningCount'] for f in d)
files_with_errors = [f['filePath'] for f in d if f['errorCount'] > 0]
print(f'  Errores : {errors}')
print(f'  Avisos  : {warnings}')
if files_with_errors:
    print('  Archivos con errores:')
    for fp in files_with_errors[:10]:
        print(f'    - {fp}')
    if len(files_with_errors) > 10:
        print(f'    ... y {len(files_with_errors) - 10} mas')
" 2>/dev/null || echo "  No se pudo parsear el reporte"
            else
              echo "  ESTADO  : Reporte no generado"
            fi

            echo ""
            echo "[ CONSTRUCCION (Build) ]"
            if [ "$BUILD_FAILED" == "true" ]; then
              echo "  ESTADO : FALLO"
              [ -f build_error.log ] && tail -n 15 build_error.log
            else
              echo "  ESTADO : Exitosa"
            fi

            echo ""
            echo "[ CODEQL ]"
            echo "  Ver resultados en: Security > Code scanning en GitHub"
            echo "============================================"
          } >> $REPORT

          # ── Fallo del pipeline si hay problemas críticos ────────────────────
          if [ "$BUILD_FAILED" == "true" ] || [ "$AUDIT_FAILED" == "true" ] || [ "$LINT_FAILED" == "true" ]; then
            exit 1
          fi

      - name: Subir Reportes como Artefacto
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporte-pipeline-${{ github.run_number }}
          path: |
            reporte-pipeline.txt
            eslint-report-legible.txt
            eslint-report.json
            npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 30
