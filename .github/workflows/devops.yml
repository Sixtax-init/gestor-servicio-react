name: "Gestión Académica: Calidad y Seguridad (DevOps)"

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    branches: [ "main", "beta" ]
  schedule:
    - cron: '0 0 * * 1' # Ejecución semanal (Lunes 00:00 UTC)
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  # TRABAJO 1: Verificación de Construcción y Calidad de Código
  test-and-build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Verificar Estilo (Lint)
        run: npm run lint -- --format json -o eslint-report.json || true

      - name: Generar Resumen de Calidad (Job Summary)
        if: always()
        run: |
          echo "### 📊 Resumen de Calidad de Código" >> $GITHUB_STEP_SUMMARY
          if [ -f eslint-report.json ]; then
            ERROR_COUNT=$(grep -o '"errorCount":[0-9]*' eslint-report.json | head -n 1 | cut -d: -f2)
            WARNING_COUNT=$(grep -o '"warningCount":[0-9]*' eslint-report.json | head -n 1 | cut -d: -f2)
            echo "| Métrica | Resultado |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Errores Críticos | $ERROR_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Advertencias | $WARNING_COUNT |" >> $GITHUB_STEP_SUMMARY
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "❌ El build fallará hasta que se corrijan los $ERROR_COUNT errores críticos." >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ Codificación lista para producción." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✅ No se detectaron problemas de estilo." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validar Construcción (Build)
        run: npm run build
        env:
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          JWT_SECRET: "ci_test_secret_key_only"

  # TRABAJO 2: Escaneo de Seguridad con CodeQL
  security-audit:
    name: Seguridad (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'
          queries: security-extended,security-and-quality

      - name: Autobuild (Analizar Estructura)
        uses: github/codeql-action/autobuild@v3

      - name: Realizar Escaneo de Vulnerabilidades
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
